name: One-time test Look items to shop categories

on:
  push:
    branches:
      - feature/look-items-to-shop-categories
    paths:
      - .github/workflows/test-look-items-shop-once.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/look-items-to-shop-categories
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
