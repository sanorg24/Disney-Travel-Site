name: LCP Header A-B

on:
  push:
    branches:
      - lcp-header-stripped-test
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full-header baseline
        uses: actions/checkout@v4
        with:
          ref: hero-lcp-production-candidate
          path: A-full

      - name: Checkout stripped-header variant
        uses: actions/checkout@v4
        with:
          ref: lcp-header-stripped-test
          path: B-stripped

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build baseline
        run: |
          cd A-full
          npm ci
          npx @11ty/eleventy

      - name: Build stripped header
        run: |
          cd B-stripped
          npm ci
          npx @11ty/eleventy

      - name: Install Lighthouse tooling
        run: npm install --no-save lighthouse http-server

      - name: Run full-header baseline
        run: |
          npx http-server A-full/_site -p 8080 -c-1 > /tmp/lh-a.log 2>&1 &
          PID=$!
          sleep 3
          npx lighthouse http://127.0.0.1:8080/index.html \
            --only-categories=performance \
            --output=json \
            --output-path=./lighthouse-A.json \
            --chrome-flags="--headless --no-sandbox --disable-gpu" \
            --quiet
          kill $PID || true

      - name: Run stripped-header variant
        run: |
          npx http-server B-stripped/_site -p 8081 -c-1 > /tmp/lh-b.log 2>&1 &
          PID=$!
          sleep 3
          npx lighthouse http://127.0.0.1:8081/index.html \
            --only-categories=performance \
            --output=json \
            --output-path=./lighthouse-B.json \
            --chrome-flags="--headless --no-sandbox --disable-gpu" \
            --quiet
          kill $PID || true

      - name: Print comparison
        run: |
          node - <<'NODE'
          const fs = require('fs');
          function metrics(file) {
            const r = JSON.parse(fs.readFileSync(file,'utf8'));
            const a = r.audits;
            const lcpDetails = a['largest-contentful-paint-element']?.details?.items;
            const phaseRows = lcpDetails?.[1]?.items || [];
            const phase = Object.fromEntries(phaseRows.map(x => [x.phase, Math.round(x.timing || 0)]));
            const lcpEl = lcpDetails?.[0]?.items?.[0]?.node;
            return {
              performance: Math.round((r.categories.performance.score || 0) * 100),
              fcp_ms: Math.round(a['first-contentful-paint']?.numericValue || 0),
              lcp_ms: Math.round(a['largest-contentful-paint']?.numericValue || 0),
              tbt_ms: Math.round(a['total-blocking-time']?.numericValue || 0),
              cls: a['cumulative-layout-shift']?.numericValue,
              speed_index_ms: Math.round(a['speed-index']?.numericValue || 0),
              lcp_selector: lcpEl?.selector,
              lcp_top_px: lcpEl?.boundingRect?.top,
              lcp_height_px: lcpEl?.boundingRect?.height,
              lcp_breakdown_ms: {
                ttfb: phase['TTFB'] || 0,
                load_delay: phase['Load Delay'] || 0,
                load_time: phase['Load Time'] || 0,
                render_delay: phase['Render Delay'] || 0
              }
            };
          }
          const A = metrics('lighthouse-A.json');
          const B = metrics('lighthouse-B.json');
          console.log(JSON.stringify({
            A_full_header: A,
            B_stripped_header: B,
            B_minus_A_lcp_ms: B.lcp_ms - A.lcp_ms,
            B_minus_A_render_delay_ms: B.lcp_breakdown_ms.render_delay - A.lcp_breakdown_ms.render_delay,
            B_minus_A_performance_points: B.performance - A.performance
          }, null, 2));
          NODE

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: lcp-header-ab
          path: |
            lighthouse-A.json
            lighthouse-B.json
          retention-days: 3
