name: SEO heading validation

on:
  push:
    branches:
      - seo-heading-structure

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build site
        run: npm run build
      - name: Verify semantic article headings
        run: |
          grep -R -q '<h2>1. Start With the People' _site
          grep -R -q '<h2>🏰 MAGIC KINGDOM</h2>' _site
          grep -R -q '<h3>Piston Peak is bringing Cars to Frontierland</h3>' _site
          grep -R -q '<h2>Before You Head to the Parks...' _site
