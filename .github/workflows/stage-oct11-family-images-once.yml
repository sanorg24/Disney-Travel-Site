name: One-time stage Oct 11 family images

on:
  push:
    branches:
      - update/oct-11-two-ride-news
    paths:
      - .github/workflows/stage-oct11-family-images-once.yml

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: update/oct-11-two-ride-news
          fetch-depth: 0

      - name: Download approved family photos
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 "https://at.adobe.com/dp2mMnnrQYrdeMc1" -o photos/oct-11-tianas-bayou-family.png
          curl -L --fail --retry 3 "https://at.adobe.com/Ye6cxIiO5nqyCinz" -o photos/oct-11-rise-resistance-family.png
          file photos/oct-11-tianas-bayou-family.png
          file photos/oct-11-rise-resistance-family.png

      - name: Commit family photos
        run: |
          git config user.name "TPPF Article Update"
          git config user.email "actions@users.noreply.github.com"
          git add photos/oct-11-tianas-bayou-family.png photos/oct-11-rise-resistance-family.png
          git commit -m "Add Oct 11 family photos"
          git push origin HEAD:update/oct-11-two-ride-news
