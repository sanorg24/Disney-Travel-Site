name: SEO blog metadata validation

on:
  push:
    branches:
      - seo-blog-meta-internal-links

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build site
        run: npm run build
      - name: Verify blog metadata
        run: |
          grep -q 'Disney Tips, News' _site/blog.html
          grep -q 'The Pixie Packed Family</title>' _site/blog.html
          grep -q 'Real-family Disney tips, Walt Disney World news, packing help, outfit inspiration, and family stories from The Pixie Packed Family.' _site/blog.html
