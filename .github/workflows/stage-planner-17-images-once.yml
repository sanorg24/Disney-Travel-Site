name: One-time stage 17-page planner images

on:
  push:
    branches:
      - launch/free-17-page-disney-vacation-planner
    paths:
      - .github/workflows/stage-planner-17-images-once.yml

permissions:
  contents: write

jobs:
  stage-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout launch branch
        uses: actions/checkout@v4
        with:
          ref: launch/free-17-page-disney-vacation-planner
          fetch-depth: 0

      - name: Download approved planner promo and preview images
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 "https://at.adobe.com/nutze2z9RNkQn3JI" -o photos/promo-vacation-planner-17.jpg
          curl -L --fail --retry 3 "https://at.adobe.com/slk4KseWEPTbEOeX" -o photos/vacation-guide-carousel-1.jpg
          curl -L --fail --retry 3 "https://at.adobe.com/RXmaqym5hq1WEutP" -o photos/vacation-guide-carousel-2.jpg
          curl -L --fail --retry 3 "https://at.adobe.com/KNhhBv62vRfqQL4G" -o photos/vacation-guide-carousel-3.jpg
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          paths = [
            "photos/promo-vacation-planner-17.jpg",
            "photos/vacation-guide-carousel-1.jpg",
            "photos/vacation-guide-carousel-2.jpg",
            "photos/vacation-guide-carousel-3.jpg",
          ]
          for p in paths:
              im=Image.open(p)
              im.verify()
              print(p, im.format, im.size)
          PY

      - name: Commit approved planner images
        run: |
          git config user.name "TPPF Planner Launch"
          git config user.email "actions@users.noreply.github.com"
          git add photos/promo-vacation-planner-17.jpg photos/vacation-guide-carousel-1.jpg photos/vacation-guide-carousel-2.jpg photos/vacation-guide-carousel-3.jpg
          git commit -m "Add approved 17-page planner promo and previews"
          git push origin HEAD:launch/free-17-page-disney-vacation-planner
