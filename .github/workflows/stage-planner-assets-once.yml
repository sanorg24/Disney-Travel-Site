name: One-time stage 17-page planner assets

on:
  push:
    branches:
      - launch/free-17-page-disney-vacation-planner
    paths:
      - .github/workflows/stage-planner-assets-once.yml

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: launch/free-17-page-disney-vacation-planner
          fetch-depth: 0

      - name: Download approved planner promo and previews
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 "https://at.adobe.com/F6QZxIwjiglSdRla" -o photos/promo-vacation-planner-17.jpg
          curl -L --fail --retry 3 "https://at.adobe.com/GAhOEo8SELGdppcO" -o photos/vacation-guide-carousel-1.jpg
          curl -L --fail --retry 3 "https://at.adobe.com/Sco90wKAJTGMUbg2" -o photos/vacation-guide-carousel-2.jpg
          curl -L --fail --retry 3 "https://at.adobe.com/h6n2B9OEHUw7Xsnj" -o photos/vacation-guide-carousel-3.jpg
          file photos/promo-vacation-planner-17.jpg
          file photos/vacation-guide-carousel-1.jpg
          file photos/vacation-guide-carousel-2.jpg
          file photos/vacation-guide-carousel-3.jpg

      - name: Commit planner assets
        run: |
          git config user.name "TPPF Planner Launch"
          git config user.email "actions@users.noreply.github.com"
          git add photos/promo-vacation-planner-17.jpg photos/vacation-guide-carousel-1.jpg photos/vacation-guide-carousel-2.jpg photos/vacation-guide-carousel-3.jpg
          git commit -m "Add final 17-page planner promo and previews"
          git push origin HEAD:launch/free-17-page-disney-vacation-planner
