name: One-time test outfits social preview

on:
  push:
    branches:
      - fix/outfits-social-preview
    paths:
      - .github/workflows/test-outfits-social-preview-once.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/outfits-social-preview
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
