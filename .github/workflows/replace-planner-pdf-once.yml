name: One-time replace planner PDF

on:
  push:
    branches:
      - fix/final-mobile-safe-planner-pdf
    paths:
      - .github/workflows/replace-planner-pdf-once.yml

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/final-mobile-safe-planner-pdf
          fetch-depth: 0

      - name: Download verified flattened planner PDF
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 "https://at.adobe.com/3p1Sn6ef4RYUgyeZ" -o guides/disney-vacation-planning-guide.pdf
          test "$(head -c 4 guides/disney-vacation-planning-guide.pdf)" = "%PDF"
          python -m pip install --quiet pypdf
          python - <<'PY'
          from pypdf import PdfReader
          path = "guides/disney-vacation-planning-guide.pdf"
          r = PdfReader(path)
          assert len(r.pages) == 13, f"Expected 13 pages, got {len(r.pages)}"
          print(f"Verified {len(r.pages)} pages")
          PY

      - name: Commit replacement PDF
        run: |
          git config user.name "TPPF Planner Repair"
          git config user.email "actions@users.noreply.github.com"
          git add guides/disney-vacation-planning-guide.pdf
          git commit -m "Replace planner PDF with mobile-safe Canva master"
          git push origin HEAD:fix/final-mobile-safe-planner-pdf
