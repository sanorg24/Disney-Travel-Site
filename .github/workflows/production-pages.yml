name: Checkpoint 4.3A - Production Pages deployment (manual only)

# Pinned to the exact Checkpoint 4.3B-verified commit on checkpoint-4-pilot
# (679c9417d94625ac5690236b451e1be509be842a), not the mutable branch name.
# This guarantees the production deployment builds precisely the revision
# that passed the Checkpoint 4.3B build and artifact verification.
#
# Manual trigger only. The Backpacks page is now generated by Eleventy at
# accessories-backpacks.html. admin/ and the four internal docs remain
# excluded by the pinned source's eleventy.config.js.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pinned Checkpoint 4.3B revision
        uses: actions/checkout@v4
        with:
          ref: 679c9417d94625ac5690236b451e1be509be842a

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build with Eleventy
        run: npx @11ty/eleventy

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
