name: CMS edits - open pull request

on:
  push:
    branches:
      - cms-edits

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Check for existing CMS pull request
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COUNT=$(gh pr list \
            --repo "${{ github.repository }}" \
            --head cms-edits \
            --base main \
            --state open \
            --json number \
            --jq 'length')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Create CMS pull request
        if: steps.existing.outputs.count == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --repo "${{ github.repository }}" \
            --head cms-edits \
            --base main \
            --title "CMS content updates" \
            --body "Automatic pull request for content changes saved through Sveltia CMS. Review the changes before merging into main."
