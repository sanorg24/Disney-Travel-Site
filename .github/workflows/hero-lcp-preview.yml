name: Hero LCP A-B Comparison — candidate branch

on:
  push:
    branches:
      - hero-lcp-control-test
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main into A
        uses: actions/checkout@v4
        with:
          ref: main
          path: A-main

      - name: Checkout candidate branch into B
        uses: actions/checkout@v4
        with:
          ref: hero-lcp-control-test
          path: B-candidate

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build A — current main
        working-directory: A-main
        run: |
          npm ci
          npx @11ty/eleventy

      - name: Build B — candidate branch
        working-directory: B-candidate
        run: |
          npm ci
          npx @11ty/eleventy

      - name: Install Lighthouse test tools
        run: npm install --no-save lighthouse http-server

      - name: Run A — current main
        run: |
          npx http-server A-main/_site -p 8080 -c-1 > /tmp/lh-a-http.log 2>&1 &
          SERVER_PID=$!
          sleep 3
          npx lighthouse http://127.0.0.1:8080/index.html \
            --only-categories=performance \
            --output=json \
            --output-path=./lighthouse-A-main.json \
            --chrome-flags="--headless --no-sandbox --disable-gpu" \
            --quiet
          kill $SERVER_PID || true

      - name: Run B — candidate branch
        run: |
          npx http-server B-candidate/_site -p 8081 -c-1 > /tmp/lh-b-http.log 2>&1 &
          SERVER_PID=$!
          sleep 3
          npx lighthouse http://127.0.0.1:8081/index.html \
            --only-categories=performance \
            --output=json \
            --output-path=./lighthouse-B-candidate.json \
            --chrome-flags="--headless --no-sandbox --disable-gpu" \
            --quiet
          kill $SERVER_PID || true

      - name: Print A-B comparison
        run: |
          node - <<'NODE'
          const fs = require('fs');
          function metrics(file) {
            const r = JSON.parse(fs.readFileSync(file, 'utf8'));
            const a = r.audits;
            return {
              performance: Math.round((r.categories.performance.score || 0) * 100),
              fcp_ms: Math.round(a['first-contentful-paint']?.numericValue || 0),
              lcp_ms: Math.round(a['largest-contentful-paint']?.numericValue || 0),
              tbt_ms: Math.round(a['total-blocking-time']?.numericValue || 0),
              cls: a['cumulative-layout-shift']?.numericValue,
              speed_index_ms: Math.round(a['speed-index']?.numericValue || 0)
            };
          }
          const A = metrics('lighthouse-A-main.json');
          const B = metrics('lighthouse-B-candidate.json');
          console.log(JSON.stringify({
            A_current_main: A,
            B_candidate_branch: B,
            B_minus_A_lcp_ms: B.lcp_ms - A.lcp_ms,
            B_minus_A_performance_points: B.performance - A.performance
          }, null, 2));
          NODE

      - name: Upload A-B Lighthouse reports
        uses: actions/upload-artifact@v4
        with:
          name: hero-lcp-candidate-ab-reports
          path: |
            lighthouse-A-main.json
            lighthouse-B-candidate.json
          retention-days: 3
