name: Hero LCP A-B Comparison — JPG + dimensions

on:
  push:
    branches:
      - hero-lcp-control-test
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main into A
        uses: actions/checkout@v4
        with:
          ref: main
          path: A-main

      - name: Checkout JPG test branch into B
        uses: actions/checkout@v4
        with:
          ref: hero-lcp-control-test
          path: B-jpg

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build A — current main
        working-directory: A-main
        run: |
          npm ci
          npx @11ty/eleventy

      - name: Build B — JPG hero
        working-directory: B-jpg
        run: |
          npm ci
          npx @11ty/eleventy

      - name: Add fetchpriority and intrinsic dimensions to B hero
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('B-jpg/_site/index.html')
          s = p.read_text()
          old = '<img src="photos/family-castle.jpg" alt="The Pixie Packed Family at Magic Kingdom">'
          new = '<img src="photos/family-castle.jpg" alt="The Pixie Packed Family at Magic Kingdom" width="933" height="1400" fetchpriority="high">'
          if old not in s:
              raise SystemExit('Expected hero img markup not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Install Lighthouse test tools
        run: npm install --no-save lighthouse http-server

      - name: Run A — current main
        run: |
          npx http-server A-main/_site -p 8080 -c-1 > /tmp/lh-a-http.log 2>&1 &
          SERVER_PID=$!
          sleep 3
          npx lighthouse http://127.0.0.1:8080/index.html \
            --only-categories=performance \
            --output=json \
            --output-path=./lighthouse-A-main.json \
            --chrome-flags="--headless --no-sandbox --disable-gpu" \
            --quiet
          kill $SERVER_PID || true

      - name: Run B — JPG + dimensions + fetchpriority
        run: |
          npx http-server B-jpg/_site -p 8081 -c-1 > /tmp/lh-b-http.log 2>&1 &
          SERVER_PID=$!
          sleep 3
          npx lighthouse http://127.0.0.1:8081/index.html \
            --only-categories=performance \
            --output=json \
            --output-path=./lighthouse-B-jpg-dimensions.json \
            --chrome-flags="--headless --no-sandbox --disable-gpu" \
            --quiet
          kill $SERVER_PID || true

      - name: Print A-B comparison
        run: |
          node - <<'NODE'
          const fs = require('fs');
          function metrics(file) {
            const r = JSON.parse(fs.readFileSync(file, 'utf8'));
            const a = r.audits;
            return {
              performance: Math.round((r.categories.performance.score || 0) * 100),
              fcp_ms: Math.round(a['first-contentful-paint']?.numericValue || 0),
              lcp_ms: Math.round(a['largest-contentful-paint']?.numericValue || 0),
              tbt_ms: Math.round(a['total-blocking-time']?.numericValue || 0),
              cls: a['cumulative-layout-shift']?.numericValue,
              speed_index_ms: Math.round(a['speed-index']?.numericValue || 0)
            };
          }
          const A = metrics('lighthouse-A-main.json');
          const B = metrics('lighthouse-B-jpg-dimensions.json');
          console.log(JSON.stringify({
            A_current_main_webp_fetchpriority: A,
            B_jpg_dimensions_fetchpriority: B,
            B_minus_A_lcp_ms: B.lcp_ms - A.lcp_ms,
            B_minus_A_performance_points: B.performance - A.performance
          }, null, 2));
          NODE

      - name: Upload A-B Lighthouse reports
        uses: actions/upload-artifact@v4
        with:
          name: hero-lcp-jpg-dimensions-ab-reports
          path: |
            lighthouse-A-main.json
            lighthouse-B-jpg-dimensions.json
          retention-days: 3
