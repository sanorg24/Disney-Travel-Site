# Sveltia CMS configuration for The Pixie Packed Family.
# backend.repo is the real repository; branch is the working branch
# Sveltia writes to (cms-edits), never main directly. Saves become a
# PR that a human reviews and merges -- see CLAUDE.md/ARCHITECTURE.md
# for the full CMS -> cms-edits -> PR -> merge -> deploy workflow.

backend:
  name: github
  repo: sanorg24/Disney-Travel-Site
  branch: cms-edits
  
media_folder: "/photos"
public_folder: "/photos"

collections:
  # ------------------------------------------------------------------
  # Filtered Category views -- for FINDING, EDITING, and HIDING/REMOVING
  # existing products. Every one of these reads/writes the exact same
  # files as the master "Products" collection below -- none of this is a
  # separate or duplicate copy of any product. Add new products from the
  # master Products collection instead -- these filtered views do not
  # automatically set a new product's Category.
  # ------------------------------------------------------------------
  - { divider: true }
  # ---- ACCESSORIES ----
  - name: "products_backpacks"
    label: "Backpacks"
    folder: "content/products"
    create: true
    delete: true
    filter: { field: "category", value: "backpacks" }
    sortable_fields:
      fields: ["subgroup", "order", "name"]
      default: { field: "subgroup", direction: "ascending" }
    thumbnail: "image"
    fields:
      - label: "Product Name"
        name: "name"
        widget: "string"
      - label: "Product Image"
        name: "image"
        widget: "image"
        required: false
      - label: "Image Alt Text"
        name: "alt"
        widget: "string"
        required: false
        hint: "Briefly describe what is shown in the product image."
      - label: "Amazon Affiliate URL"
        name: "amazon_url"
        widget: "string"
        pattern: ["^https://amzn\\.to/", "Must be an amzn.to affiliate link."]
      - label: "Image Source"
        name: "image_source"
        widget: "select"
        options: ["uploaded", "amazon"]
        default: "uploaded"
      - label: "Status"
        name: "status"
        widget: "select"
        options: ["draft", "published", "hidden"]
        default: "draft"
      - label: "Display Order"
        name: "order"
        widget: "number"
        value_type: "int"
        required: false
      - label: "Category"
        name: "category"
        widget: "relation"
        collection: "taxonomy_categories"
        value_field: "slug"
        display_field: "label"
        search_fields: ["label"]
        hint: "Changing this moves the product to a different shop page's data -- it does not create a new page or sidebar entry."
      - label: "Subgroup"
        name: "subgroup"
        widget: "relation"
        collection: "taxonomy_subgroups"
        value_field: "slug"
        display_field: "label"
        search_fields: ["label"]
        required: false
      - label: "Our Pixie Packed Tip"
        name: "pixie_tip"
        widget: "text"
        required: false
      - label: "Personal Photo"
        name: "personal_photo"
        widget: "image"
        required: false
      - label: "Personal Photo Alt Text"
        name: "personal_photo_alt"
        widget: "string"
        required: false
      - label: "Personal Video URL"
        name: "personal_video_url"
        widget: "string"
        required: false
        pattern: ["^$|^https?://", "Must be a full web address starting with http:// or https://, or left blank."]
      - label: "Page Template Setting (do not change)"
        name: "permalink"
        widget: "hidden"
        default: false
