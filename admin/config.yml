  # ------------------------------------------------------------------
  # Taxonomy -- editable Groups/Categories/Subgroups. Renaming a Label
  # here is a safe, CMS-only change. Structural changes -- a brand new
  # Category or Group actually appearing as a live page or a new
  # sidebar entry above -- still require a code/config update from
  # Troy; adding a taxonomy record here does not do that by itself.
  # ------------------------------------------------------------------
  - name: "taxonomy_groups"
    label: "TAXONOMY: Groups"
    folder: "content/taxonomy/groups"
    create: true
    delete: true
    slug: "{{fields.slug}}"
    sortable_fields:
      fields: ["order", "label"]
      default: { field: "order", direction: "ascending" }
    fields:
      - label: "Display Label"
        name: "label"
        widget: "string"
        hint: "Safe to rename anytime -- this is just the display name."
      - label: "Stable Slug"
        name: "slug"
        widget: "string"
        pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', "Lowercase letters, numbers, and single hyphens only (e.g. travel-essentials) -- no spaces, capital letters, or symbols."]
        hint: "Permanent internal ID. Do not change after Categories are assigned to this Group unless you are deliberately performing a planned structural migration."
      - label: "Display Order"
        name: "order"
        widget: "number"
        value_type: "int"
        required: false
      - label: "Active"
        name: "active"
        widget: "boolean"
        default: true
        hint: "Marks this Group as retired for new assignments. Does NOT hide any existing page, sidebar entry, or product -- those all stay exactly as they are unless changed separately by Troy."
      - label: "Page URL"
        name: "permalink_path"
        widget: "string"
        required: false
        hint: "The exact public page filename for this Group, e.g. accessories.html. Leave set to whatever Troy configures -- changing this after the page is live will break its URL."
      - label: "Shop Card Description"
        name: "description"
        widget: "text"
        required: false
        hint: "Short blurb shown on this Group's Shop hub card."
      - label: "Page Template Setting (do not change)"
        name: "permalink"
        widget: "hidden"
        default: false

  - name: "taxonomy_categories"
    label: "TAXONOMY: Categories"
    folder: "content/taxonomy/categories"
    create: true
    delete: true
    slug: "{{fields.slug}}"
    sortable_fields:
      fields: ["group", "order", "label"]
      default: { field: "order", direction: "ascending" }
    fields:
      - label: "Display Label"
        name: "label"
        widget: "string"
        hint: "Safe to rename anytime -- this is just the display name shown in dropdowns. It does NOT change the public page title/heading or the sidebar collection name; those are separate and still require a code/config update from Troy."
      - label: "Stable Slug"
        name: "slug"
        widget: "string"
        pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', "Lowercase letters, numbers, and single hyphens only (e.g. accessories-jewelry) -- no spaces, capital letters, or symbols."]
        hint: "Permanent internal ID used by Products and the public URL. Do not change after Products are assigned to this Category unless you are deliberately performing a planned structural migration."
      - label: "Group"
        name: "group"
        widget: "relation"
        collection: "taxonomy_groups"
        value_field: "slug"
        display_field: "label"
        search_fields: ["label"]
      - label: "Display Order"
        name: "order"
        widget: "number"
        value_type: "int"
        required: false
      - label: "Active"
        name: "active"
        widget: "boolean"
        default: true
        hint: "Marks this Category as retired for new assignments. Does NOT remove its public page, its sidebar entry, or any existing product -- those all stay exactly as they are unless changed separately by Troy."
      - label: "Card / Page Description"
        name: "description"
        widget: "text"
        required: false
        hint: "Shown on this Category's hub card and as the intro text on its own page. Leave blank only if you're fine with no description text showing."
      - label: "Meta Description"
        name: "meta_description"
        widget: "text"
        required: false
        hint: "Used for search engines and link previews for this Category's page. If left blank, no meta description is set."
      - label: "Card / Hero Title (optional override)"
        name: "card_title"
        widget: "string"
        required: false
        hint: "Leave blank to use the Display Label above for the hub card and page heading. Only set this if you want shorter/different public-facing text than the Label (e.g. Label \"Men's Apparel\" but card/heading just \"Men's\")."
      - label: "Hero Eyebrow (optional override)"
        name: "eyebrow"
        widget: "string"
        required: false
        hint: "Small label shown above the page heading. Leave blank to use the parent Group's Display Label automatically. Only set this if this Category's page should show different eyebrow text than its Group."
      - label: "Back Link Text (optional override)"
        name: "back_link_label"
        widget: "string"
        required: false
        hint: "The \"← Back to ...\" link text at the top of this Category's page. Leave blank to automatically use \"← Back to\" plus the parent Group's Display Label. Only set this if you want different text."
      - label: "Hub Card Button Text (optional override)"
        name: "button_label"
        widget: "string"
        required: false
        hint: "Leave blank to use Card/Hero Title above for the hub card's \"Shop ... →\" button. Only set this if the button should say something shorter/different than the card title."
      - label: "Card Image (optional override)"
        name: "card_image"
        widget: "image"
        required: false
        hint: "Leave blank to automatically use the first published Product's photo in this Category (by that Product's Display Order). Only set this if you want a specific image instead of that default."
      - label: "Public Page Permalink"
        name: "permalink_path"
        widget: "string"
        required: false
        hint: "The exact public page filename for this Category, e.g. accessories-hats.html. This now directly controls where the page is generated -- changing it after the page is live will change/break its URL, so only edit deliberately."
      - label: "Page Template Setting (do not change)"
        name: "permalink"
        widget: "hidden"
        default: false

  - name: "taxonomy_subgroups"
    label: "TAXONOMY: Subgroups"
    folder: "content/taxonomy/subgroups"
    create: true
    delete: true
    slug: "{{fields.slug}}"
    sortable_fields:
      fields: ["category", "order", "label"]
      default: { field: "order", direction: "ascending" }
    fields:
      - label: "Display Label (internal/dropdown)"
        name: "label"
        widget: "string"
        hint: "Shown in CMS dropdowns (e.g. when picking a Subgroup for a Product). Safe to rename anytime. This is NOT what visitors see as the section heading -- that's the separate 'Public Heading' field below."
      - label: "Stable Slug"
        name: "slug"
        widget: "string"
        pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', "Lowercase letters, numbers, and single hyphens only (e.g. loungefly-backpacks) -- no spaces, capital letters, or symbols."]
        hint: "Permanent internal ID used by Products. Do not change after Products are assigned to this Subgroup unless you are deliberately performing a planned structural migration."
      - label: "Public Heading"
        name: "display_label"
        widget: "string"
        hint: "The short heading visitors actually see on the Category page above this Subgroup's products (e.g. \"Men's\", \"Backpacks\"). Keep it short -- this is what's shown, not the longer internal label above."
      - label: "Category"
        name: "category"
        widget: "relation"
        collection: "taxonomy_categories"
        value_field: "slug"
        display_field: "label"
        search_fields: ["label"]
      - label: "Display Order"
        name: "order"
        widget: "number"
        value_type: "int"
        required: false
      - label: "Active"
        name: "active"
        widget: "boolean"
        default: true
        hint: "Marks this Subgroup as retired for new assignments. Does NOT remove any existing product from view -- those stay exactly as they are unless changed separately."
      - label: "Page Template Setting (do not change)"
        name: "permalink"
        widget: "hidden"
        default: false

  - name: "taxonomy_themes"
    label: "TAXONOMY: Collection Themes"
    folder: "content/taxonomy/themes"
    create: true
    delete: true
    slug: "{{fields.slug}}"
    sortable_fields:
      fields: ["order", "label"]
      default: { field: "order", direction: "ascending" }
    fields:
      - label: "Section Heading"
        name: "label"
        widget: "string"
        hint: "The public heading visitors see for this section on the Shop Disney Collections page (e.g. \"Park Day Outfits\"). Also shown in the Theme Section dropdown when creating a Look."
      - label: "Stable Slug"
        name: "slug"
        widget: "string"
        pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', "Lowercase letters, numbers, and single hyphens only (e.g. park-day-outfits) -- no spaces, capital letters, or symbols."]
        hint: "Permanent internal ID used by Looks. Do not change after Looks are assigned to this Theme unless you are deliberately performing a planned structural migration."
      - label: "Section Subtitle"
        name: "subtitle"
        widget: "text"
        required: false
        hint: "Optional short line shown under the section heading. Leave blank to show no subtitle."
      - label: "Display Order"
        name: "order"
        widget: "number"
        value_type: "int"
        required: false
      - label: "Active"
        name: "active"
        widget: "boolean"
        default: true
        hint: "Marks this Theme as retired for new assignments. Does NOT remove any existing Look from view -- those stay exactly as they are unless changed separately."
      - label: "Page Template Setting (do not change)"
        name: "permalink"
        widget: "hidden"
        default: false

  # ------------------------------------------------------------------
  # Blog -- one content file per article. The public URL, page layout,
  # and Blog Hub card are all generated automatically from these fields;
  # no code/template change is needed to publish a new post. Place inline
  # photographs directly in the Body editor (drag, drop, paste, or the
  # toolbar's image button) exactly where they should appear in the
  # article -- no separate field and no HTML needed.
  # ------------------------------------------------------------------
  - { divider: true }
  - name: "blog_posts"
    label: "Blog Posts"
    folder: "content/blog"
    create: true
    slug: "{{slug}}"
    thumbnail: "hero_image"
    fields:
      - label: "Title"
        name: "title"
        widget: "string"
      - label: "Publish Date"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
      - label: "Category"
        name: "tag"
        widget: "select"
        options:
          - { label: "Travel Tips", value: "travel-tips" }
          - { label: "Disney News & Updates", value: "disney-news" }
          - { label: "Outfits & Packing", value: "outfit-inspiration" }
          - { label: "Family & Accessibility", value: "family-accessibility" }
      - label: "Excerpt"
        name: "excerpt"
        widget: "text"
        hint: "Shown on the Blog Hub card. Can read like a hook to click through -- it does not need to match the SEO description below."
      - label: "Meta Description"
        name: "meta_description"
        widget: "text"
        hint: "The article's search-engine/page description. Separate from the Excerpt above -- these can say different things."
      - label: "Featured/Hero Image"
        name: "hero_image"
        widget: "image"
        required: false
        hint: "Shown near the top of the article and reused automatically as this post's Blog Hub card image."
      - label: "Featured/Hero Image Alt Text"
        name: "hero_alt"
        widget: "string"
        required: false
        hint: "Briefly describe what is shown in the Featured/Hero image."
      - label: "Status"
        name: "status"
        widget: "select"
        options: ["draft", "published"]
        default: "draft"
      - label: "Body"
        name: "body"
        widget: "markdown"
        hint: "Write the article here. To add a photo, drag it in, paste it, or use the toolbar's image button, right where you want it to appear -- no HTML needed."
